<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PILGRIMS: Data Intelligence · Orpheus Ocean</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04080f;
  --s1: #080f1d;
  --s2: #0b1626;
  --s3: #101e30;
  --border: #1a2e48;
  --border2: #243d5a;
  --teal: #0fb87a;
  --teal2: #0a8a5c;
  --tealDim: #0fb87a22;
  --blue: #3b82f6;
  --blueDim: #3b82f622;
  --red: #f43f5e;
  --redDim: #f43f5e22;
  --amber: #f59e0b;
  --amberDim: #f59e0b22;
  --purple: #a855f7;
  --purpleDim: #a855f722;
  --green: #22c55e;
  --greenDim: #22c55e18;
  --text: #e8f0f8;
  --textDim: #7a9ab8;
  --textMuted: #3d5570;
  --A: #22c55e; --Abg: #22c55e18;
  --B: #3b82f6; --Bbg: #3b82f618;
  --C: #f59e0b; --Cbg: #f59e0b18;
  --D: #f43f5e; --Dbg: #f43f5e18;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text)}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes appear{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

.fade-up{animation:fadeUp 0.45s ease-out both}
.mono{font-family:'DM Mono',monospace}

.topbar{background:var(--s1);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--teal);letter-spacing:0.08em}
.logo span{color:var(--textDim);font-weight:400;margin-left:10px;font-size:12px;font-family:'DM Mono',monospace}
.topright{font-size:11px;color:var(--textMuted);font-family:'DM Mono',monospace}

.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

.section-sub{font-size:13px;color:var(--textDim);margin-bottom:24px;line-height:1.7;max-width:680px}

.card{background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:20px 22px}

.pipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pipe-cell{background:var(--s1);padding:16px 18px}
.pipe-label{font-size:10px;color:var(--textMuted);letter-spacing:0.12em;font-family:'DM Mono',monospace;margin-bottom:8px}
.pipe-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:4px}
.pipe-sub{font-size:11px;color:var(--textDim)}

.sensor-table{width:100%;border-collapse:collapse}
.sensor-table th{font-size:10px;font-weight:600;color:var(--textMuted);letter-spacing:0.12em;font-family:'DM Mono',monospace;padding:8px 14px;text-align:left;border-bottom:1px solid var(--border)}
.sensor-table td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
.sensor-table tr:last-child td{border-bottom:none}
.sensor-table tr{transition:background 0.15s}
.sensor-table tr:hover td{background:var(--s2)}

.grade{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;font-family:'Syne',sans-serif;font-size:14px;font-weight:800}

.bar-wrap{height:4px;background:var(--border);border-radius:2px;min-width:80px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}

.flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:'DM Mono',monospace;font-weight:500;padding:2px 8px;border-radius:3px;white-space:nowrap}

.scenario{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:7px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:border-color 0.2s,background 0.2s}
.scenario.open{background:var(--s2);border-left-color:var(--teal)}
.scenario-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scenario-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px}
.scenario-meta{font-size:11px;color:var(--textMuted);font-family:'DM Mono',monospace}
.scenario-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;animation:fadeIn 0.2s ease-out}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--textMuted);font-size:13px;font-weight:500;padding:11px 20px;transition:all 0.15s;margin-bottom:-1px}
.tab.active{border-bottom-color:var(--teal);color:var(--teal);font-weight:600}

.mvs-row{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.mvs-row:last-child{border-bottom:none}

.callout{background:linear-gradient(135deg,#0a1c10,#091424);border:1px solid var(--teal2);border-radius:8px;padding:20px 24px;position:relative;overflow:hidden}
.callout::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--teal),transparent)}

.divider{height:1px;background:var(--border);margin:36px 0}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <span class="logo">PILGRIMS <span>Data Intelligence · Orpheus Ocean · Orpheus AUV</span></span>
  </div>
  <div class="topright">read-only · post-expedition · pilot analysis</div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState} = React;

// ── SENSOR DATA ───────────────────────────────────────────────────────────────
const SENSORS = [
  {
    id:"camera", name:"SmartSight MV100 (FLIR Blackfly S)", cat:"Science",
    iface:"GigE Vision",
    uptime:null, quality:"DEGRADED", sciImpact:"CRITICAL",
    grade:"B+",
    gradeNote:"Primary mission deliverable: terrain maps and biological imagery are the core science output. Feature-tracking failures detected: sudden feature-count collapse correlated with sediment plume events at the seafloor. Individually each camera event looked valid; the failure was in navigation, not in the file.",
    flags:[{t:"feature-count collapses",c:"red"},{t:"correlated with xVIO drift",c:"red"},{t:"unlogged in mission debrief",c:"amber"}],

    grade:"B+",
    gradeNote:"xVIO visual-inertial odometry is the vehicle's primary navigation brain. High uptime, but episodes of EKF divergence detected on featureless abyssal sediment plains: xVIO reported 'converged' while feature count had collapsed. Only catchable by cross-referencing xVIO velocity output against DVL bottom-track simultaneously.",
    flags:[{t:"silent EKF divergences",c:"red"},{t:"featureless terrain trigger",c:"amber"},{t:"DVL cross-validated",c:"teal"}],

    id:"depth", name:"Pressure / depth sensor", cat:"Navigation",

    flags:[{t:"drift detected",c:"red"},{t:"valid output throughout",c:"amber"},{t:"science data affected",c:"red"}],

  {
    id:"altimeter", name:"Acoustic altimeter", cat:"Navigation",

    uptime:null, quality:"CLEAN", sciImpact:"HIGH",

    gradeNote:"Reliable seafloor-proximity data across missions. Primary cross-validation reference for depth sensor during on-bottom phase. Depth drift events can be first detected via altimeter mismatch.",
    flags:[{t:"no anomalies",c:"green"},{t:"depth cross-ref active",c:"green"},{t:"key to drift detection",c:"teal"}],

    grade:"B+",
    gradeNote:"USBL operates from the surface vessel at extreme slant range. At hadal depths, acoustic attenuation and thermocline refraction cause position fix dropouts. Each dropout forces dead-reckoning fallback. The ROS bag records positions continuously (filled with dead-reckoned values). Without PILGRIMS, there is no way to know which fixes were real vs. interpolated.",

    flags:[{t:"current asymmetry detectable",c:"amber"},{t:"attitude degradation possible",c:"amber"},{t:"sediment ingestion pattern",c:"teal"}],
    pilgrims:"Welford baseline per thruster, cross-thruster ratio scored per dive. Asymmetry patterns can be flagged pre-dive once confirmed across multiple missions.",
    cost:"Integrated",
  },
  {
    id:"battery", name:"Li-ion battery", cat:"Vehicle",

    uptime:null, quality:"DEGRADED", sciImpact:"SAFETY",
    grade:"B+",
    gradeNote:"Energy budget can be exceeded on deep, long-duration missions. LED arrays may draw more power than pre-dive model due to thermal compensation at cold ambient temperatures. PILGRIMS can detect SOC depletion rate diverging from mission plan mid-mission, flagging when the vehicle may surface with less reserve than planned.",

// ── SCENARIOS ─────────────────────────────────────────────────────────────────
const SCENARIOS = [
  {
    id:"s1",
    title:"DVL bottom-lock loss · unlogged duration",
    meta:"Seamount survey · steep terrain descent",
    rosbag:"DVL topic /dvl/data: PUBLISHING. xVIO topic /xvio/state: CONVERGED. Navigation topic /nav/pose: CONTINUOUS. All monitored topics active. ROS bag file integrity check: PASS.",
    sealog:"Mission debrief log: 'Smooth descent, nominal bottom time, successful sample collection. Vehicle surfaced within expected range of predicted position.' No anomalies recorded.",
    pilgrims:"DVL bottom-lock lost during descent through steep talus slope. Lock status: NO_BOTTOM_LOCK. During this window, xVIO reported CONVERGED but was propagating visual features with zero DVL velocity aiding. Position uncertainty expanded significantly. Biological observations geolocated during this window carry position error not represented anywhere in the ROS bag.",
    insight:"Orpheus Ocean's commercial deployments are sold on publishable-quality geolocation data. A position uncertainty gap undocumented in the mission record means species observations or nodule images from that window cannot be cited with a defensible position. For a client paying for survey data, this is a data-quality liability that surfaces at publication time, not at the dock.\n\nPilot: PILGRIMS identifies this window, quantifies the position uncertainty, and logs it as a structured knowledge-base entry: DVL bottom-lock loss during steep terrain descent produces navigation uncertainty that xVIO does not self-report. Post-pilot monitoring: PILGRIMS detects DVL lock loss in the moment and flags the observation window in real time, before the mission completes.",
  },
  {
    id:"s2",
    title:"Pressure sensor drift · depth error · science data affected",
    meta:"Cold seep survey · escarpment environment",
    rosbag:"Pressure topic /depth/pressure: PUBLISHING. DVL topic /dvl/altitude: PUBLISHING. Both producing in-range, valid float values. Topic frequency nominal. No dropped messages.",

    pilgrims:"Cross-sensor depth comparison triggered. Pressure sensor reading shallower than DVL altitude + USBL depth calculation, above expected divergence baseline. Both sensors producing valid, well-formed output throughout. Divergence only visible in the comparison between them. Chemosynthetic community observations and sediment push-core attributions during the on-bottom phase carry depth error.",
    insight:"Cold seep community surveys require accurate depth attribution to distinguish species zonation. Depth errors affect correct characterisation of chemosynthetic organism depth ranges. As Orpheus Ocean scales to paying clients, published depth errors traced back to the vehicle are a reputational event.\n\nPilot: PILGRIMS retrospectively identifies every affected data point in the mission archive, attributes the root cause (cross-sensor divergence, not sensor failure), and adds the failure mode to the knowledge base. Post-pilot monitoring: PILGRIMS triggers a depth-consistency alert within seconds of divergence onset, giving the operator the option to abort the science phase before any observations are recorded with an incorrect attribution.",
  },
  {
    id:"s3",
    title:"Storage write fault · frames corrupt · discovered post-recovery",
    meta:"Ridge survey · long-duration mission",
    rosbag:"ROS bag file integrity check: PASS. Camera topic /camera/image_raw: frames recorded. All topics present. No dropped messages in topic statistics. Mission debrief: 'Successful ridge transect. Full terrain dataset expected from processing.'",
    sealog:"No anomaly recorded. Vehicle recovered nominally. Bag file downloaded to shore station. Processing team began terrain reconstruction pipeline the following morning.",
    pilgrims:"Pilot: frame integrity check against camera driver logs found CRC errors on recorded frames. Root cause: compute thermal throttling triggered mid-mission, reducing storage write bandwidth below the sustained camera frame rate. Corrupt frames carry valid timestamps but contain partial or invalid image data. The bag file passes all standard integrity checks because topic message counts do not reflect frame validity. The knowledge base now holds this failure mode, its trigger conditions, and the frame rate that would have kept the data clean.",

  },
];

// ── MVS DATA ──────────────────────────────────────────────────────────────────
const MVS = {
  missionType:"Hadal / deep-sea AUV survey (Orpheus Ocean primary mission type)",
  successCriteria:"Publishable terrain maps, species observations, and chemical samples with accurate depth attribution, geolocation, and energy-safe vehicle recovery",
  mustHave:[
    {sensor:"SmartSight MV100 camera", reason:"Primary science deliverable: terrain maps and species imagery. Mission cannot produce publishable visual data without it."},
    {sensor:"DVL (with cross-validation)", reason:"Vehicle navigation and dead-reckoning. Cross-validation against xVIO mandatory, as solo DVL loss is invisible without it."},

// ── helpers ───────────────────────────────────────────────────────────────────
function gradeColor(g){
  if(g.startsWith("A")) return {c:"var(--A)",bg:"var(--Abg)"};
  if(g.startsWith("B")) return {c:"var(--B)",bg:"var(--Bbg)"};
  if(g.startsWith("C")) return {c:"var(--C)",bg:"var(--Cbg)"};
  return {c:"var(--D)",bg:"var(--Dbg)"};
}
function qColor(q){return {CLEAN:"var(--green)",DEGRADED:"var(--amber)"}[q]||"var(--textMuted)";}
function flagStyle(c){
  return {red:{bg:"var(--redDim)",b:"var(--red)",t:"var(--red)"},amber:{bg:"var(--amberDim)",b:"var(--amber)",t:"var(--amber)"},green:{bg:"var(--greenDim)",b:"var(--green)",t:"var(--green)"},teal:{bg:"var(--tealDim)",b:"var(--teal)",t:"var(--teal)"}}[c]||{bg:"var(--s3)",b:"var(--border)",t:"var(--textDim)"};
}
function Flag({t,c}){const s=flagStyle(c);return <span className="flag" style={{background:s.bg,border:`1px solid ${s.b}`,color:s.t}}>{t}</span>;}
function SLabel({children}){return <div style={{fontSize:10,fontWeight:600,color:"var(--textMuted)",letterSpacing:"0.12em",fontFamily:"'DM Mono',monospace",marginBottom:6,textTransform:"uppercase"}}>{children}</div>;}

function UptimeBar({val}){
  if(val===null) return <span className="mono" style={{fontSize:11,color:"var(--textMuted)"}}>—</span>;
  const col = val>=97?"var(--green)":val>=92?"var(--blue)":val>=85?"var(--amber)":"var(--red)";
  return (
    <div style={{display:"flex",alignItems:"center",gap:8}}>
      <div className="bar-wrap" style={{flex:1}}>
        <div className="bar-fill" style={{width:`${val}%`,background:col}}/>
      </div>
      <span className="mono" style={{fontSize:11,color:"var(--textDim)",width:38,textAlign:"right"}}>{val}%</span>
    </div>
  );
}

function GradeBadge({g}){
  const {c,bg}=gradeColor(g);
  return <span className="grade" style={{color:c,background:bg}}>{g.replace("+","").replace("-","")}<sup style={{fontSize:8}}>{g.includes("+")?"+":g.includes("-")?"-":""}</sup></span>;
}

// ── Sensor Table ──────────────────────────────────────────────────────────────
function SensorTable({filter}){
  const [open,setOpen]=useState(null);
  const filtered = filter==="all" ? SENSORS : SENSORS.filter(s=>s.cat===filter);
  return (

                {q:"Camera logged all frames.",a:"PILGRIMS asks: how many of those frames pass frame-integrity checks against the sensor data?"},
              ].map((item,i)=>(
                <div key={i} style={{fontSize:11,lineHeight:1.7,borderLeft:"1px solid var(--teal)44",paddingLeft:8}}>
                  <span style={{color:"var(--textMuted)"}}>{item.q}</span>
                  <span style={{color:"var(--teal)",fontWeight:500}}> {item.a}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* tabs */}
      <div className="tabs">
        {[
          {id:"pipeline",label:"Pipeline Integrity"},
          {id:"sensors",label:"Sensor Contribution Grades"},
          {id:"mvs",label:"Minimal Viable Sensing"},
        ].map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      {tab==="pipeline"&&<PipelineStats/>}

      {tab==="sensors"&&(
        <div style={{animation:"fadeUp 0.35s ease-out"}}>
          <div className="section-sub" style={{marginBottom:16}}>
            PILGRIMS grades every sensor topic by four factors: topic availability, data quality within the stream, cross-sensor validation against independent sources, and contribution to publishable mission outcomes. Click any sensor to expand.
          </div>
          <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
            {[["A","Critical, performing, contributing"],["B","Important, minor issues or gaps"],["C","Operational but limited science value"],["D","High uptime, zero science contribution"]].map(([g,desc])=>{
              const {c,bg}=gradeColor(g);
              return <div key={g} style={{display:"flex",alignItems:"center",gap:7,background:"var(--s2)",border:"1px solid var(--border)",borderRadius:5,padding:"6px 12px"}}>
                <span className="grade" style={{color:c,background:bg,width:22,height:22,fontSize:12}}>{g}</span>
                <span style={{fontSize:11,color:"var(--textDim)"}}>{desc}</span>
              </div>;
            })}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
            {cats.map(c=>(
              <button key={c} onClick={()=>setCatFilter(c)}
                style={{background:catFilter===c?"var(--teal)":"transparent",color:catFilter===c?"var(--bg)":"var(--textMuted)",border:`1px solid ${catFilter===c?"var(--teal)":"var(--border)"}`,borderRadius:4,padding:"4px 12px",fontSize:11,fontFamily:"'DM Mono',monospace",fontWeight:600}}>
                {c}
              </button>
            ))}
          </div>
          <SensorTable filter={catFilter}/>
          <div className="callout" style={{marginTop:20}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:14,marginBottom:8}}>The D-grade sensors</div>
            <div style={{fontSize:12,color:"var(--textDim)",lineHeight:1.85}}>
              The drop-weight burn wires and Iridium tracker both report healthy status across all missions, and neither has contributed a single data point to a science dataset. At face value this looks like pure overhead.
              <br/><br/>
              <strong style={{color:"var(--text)"}}>PILGRIMS recommendation on the burn wires specifically:</strong> the D grade is a science-data score, not a safety score. These wires should stay. But a sensor with zero events and zero in-dive monitoring is indistinguishable from a sensor that has silently failed. PILGRIMS recommends adding pre-dive resistance trending: a corroding wire will show predictable resistance change in the period before deployment.
            </div>
          </div>
        </div>
      )}

      {tab==="mvs"&&(
        <div style={{animation:"fadeUp 0.35s ease-out"}}>
          <div className="section-sub">
            What is the minimum sensor configuration for an Orpheus Ocean mission to produce publishable science data and recover the vehicle safely? PILGRIMS builds this baseline from your mission archive, and tracks which sensors are and aren't earning their place.
          </div>
          <MVSView/>
        </div>
      )}

      <div style={{marginTop:48,paddingTop:16,borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--textMuted)",fontFamily:"'DM Mono',monospace"}}>
        <span>PILGRIMS · read-only · no writes to ROS2 bag · xVIO · mission log</span>
        <span>hello@usepilgrims.com · usepilgrims.com · Dr Martyna Stachaczyk, ARIA Fellow</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
